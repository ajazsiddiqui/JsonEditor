<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="80" ry="80" fill="#111111"/>
  <rect width="512" height="512" rx="80" ry="80" fill="none" stroke="#2a2a2a" stroke-width="6"/>

  <!-- Left brace { -->
  <text x="158" y="300" font-family="monospace" font-size="300" font-weight="bold" fill="#7a9ec0" text-anchor="middle">{</text>

  <!-- Right brace } -->
  <text x="354" y="300" font-family="monospace" font-size="300" font-weight="bold" fill="#4a6a80" text-anchor="middle">}</text>

  <!-- Green accent dot -->
  <circle cx="256" cy="350" r="18" fill="#7ec27e"/>
</svg>
